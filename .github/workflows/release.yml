name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release executable
        run: cargo build --release

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-d2-pro-battery-windows-x64
          path: target/release/model-d2-pro-battery.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: model-d2-pro-battery-windows-x64
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/model-d2-pro-battery.exe
          name: Glorious Mouse Battery Monitor ${{ github.ref_name }}
          body: |
            ## Glorious Mouse Battery Monitor ${{ github.ref_name }}

            Download and run `model-d2-pro-battery.exe`.

            Features:
            - Native Rust Windows tray application
            - Real-time battery monitoring with text display in the system tray
            - Automatic and manual mouse selection
            - 30-second automatic refresh
            - Startup toggle backed by the Windows user registry
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
